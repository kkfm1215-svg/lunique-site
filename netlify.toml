# 비밀값 검사 예외 (68일차) — 아래 두 개는 설계상 브라우저에 공개되는 키라서
# 페이지 안에 적혀 있는 게 정상이다. 진짜 비밀(FIREBASE_SA_B64, PAYPAL_SECRET 등)은 계속 검사된다.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_WEB_API_KEY,PAYPAL_CLIENT_ID"
  # 아래는 Firebase '웹' 키 — 브라우저에 공개되는 게 정상인 값이라 추측 탐지에서 제외.
  # 이 값 하나만 예외이므로, 진짜 비밀 키가 실수로 올라오면 여전히 차단된다.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAhq9SwaK0OLlXxsjilqimx9JPgsgP2zGQ"

[[edge_functions]]
  path = "/api/chat"
  function = "gemini-proxy"

# 결제 서버 (66일차) — /api/pay 로 들어오는 요청을 paypal 함수로 넘긴다
[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/paypal"
  status = 200

# 운영 대시보드 (68일차) — admin.html이 호출하는 집계 API
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

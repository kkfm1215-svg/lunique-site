# 비밀값 검사 예외 (68일차) — 아래 두 개는 설계상 브라우저에 공개되는 키라서
# 페이지 안에 적혀 있는 게 정상이다. 진짜 비밀(FIREBASE_SA_B64, PAYPAL_SECRET 등)은 계속 검사된다.
[build.environment]
  # 71일차: VAPID_PUBLIC 추가 — 푸시 알림용 '공개' 열쇠다. 브라우저에 알려줘야 하는 값이라
  # index.html 안에 적혀 있는 것이 정상인데, 이 예외가 없으면 Netlify가 "비밀이 샜다"며 배포를 막는다.
  # (비밀 열쇠 VAPID_PRIVATE는 여기 없다 — 계속 검사된다)
  SECRETS_SCAN_OMIT_KEYS = "FIREBASE_WEB_API_KEY,PAYPAL_CLIENT_ID,VAPID_PUBLIC"
  # 아래는 Firebase '웹' 키 — 브라우저에 공개되는 게 정상인 값이라 추측 탐지에서 제외.
  # 이 값 하나만 예외이므로, 진짜 비밀 키가 실수로 올라오면 여전히 차단된다.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAhq9SwaK0OLlXxsjilqimx9JPgsgP2zGQ,BKuPaGDSItrw00M53JYP-05MuP-uyhqhbHIH1gO-qaGpQJRde0-Ud7FIL19zZluzhX3l1GYpBxwmSWXCDPDM82g"

[[edge_functions]]
  path = "/api/chat"
  function = "gemini-proxy"

# 결제 서버 (66일차) — /api/pay 로 들어오는 요청을 paypal 함수로 넘긴다
[[redirects]]
  from = "/api/pay"
  to = "/.netlify/functions/paypal"
  status = 200

# 운영 대시보드 (68일차) — admin.html이 호출하는 집계 API
[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

# PWA (68일차) — 매니페스트 파일의 종류를 정확히 알려준다 (일부 브라우저의 인식 보장)
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# 푸시 알림 발송기 (71일차) — 매시 정각에 돌면서, 유저의 현지 시각이 저녁 8시인 사람에게만 보낸다.
# 나라가 달라도 각자 저녁에 받게 된다. 실제 발송 조건은 push.js 안에 있다.
[functions."push"]
  schedule = "0 * * * *"

# 손으로 한 번 돌려보고 싶을 때 쓰는 주소 (평소엔 쓸 일 없음)
[[redirects]]
  from = "/api/push-run"
  to = "/.netlify/functions/push"
  status = 200
